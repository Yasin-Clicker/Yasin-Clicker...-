<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YASIN CLICKER</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f2f2;color:#111;font-family:Arial,sans-serif;text-align:center;padding:22px 14px}
  h1{font-size:27px;margin:8px 0 22px;letter-spacing:1px}
  .label{font-weight:700;margin:14px 0 10px}
  .times{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:520px;margin:0 auto 22px}
  button{border:0;border-radius:10px;padding:12px 16px;font-size:17px;font-weight:700;background:#ddd;color:#111}
  button.selected{background:#222;color:white}
  #warning{display:none;max-width:500px;margin:0 auto 16px;padding:14px;border:2px solid #d18a00;border-radius:10px;background:#fff7df;text-align:left}
  #warning button{font-size:15px;margin:8px 5px 0 0;background:#222;color:white}
  #gameTitle{font-size:24px;font-weight:800;margin:18px 0 10px}
  #arena{width:min(92vw,520px);height:270px;margin:0 auto;background:#050505;border-radius:12px;color:white;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #count{font-size:64px;font-weight:800}
  #status{font-size:18px;margin:16px 0;min-height:25px;font-weight:700}
  #start{background:#1769d2;color:white;padding:14px 28px;margin:8px}
  #reset{background:#ddd;margin:8px}
  .small{font-size:13px;color:#555;margin-top:18px}
</style>
</head>
<body>
<h1>YASIN CLICKER</h1>
<div class="label">SÜRE SEÇ</div>
<div class="times" id="times"></div>
<div id="warning">
  <b>⚠️ Dikkat!</b><br>
  Uzun süre boyunca sürekli tıklamak parmağını yorabilir. Rahatsızlık hissedersen durup mola ver.
  <div><button id="continue">Devam</button><button id="cancel">Vazgeç</button></div>
</div>
<div id="gameTitle">TIKLA!</div>
<div id="arena" role="button" aria-label="Tıklama alanı"><span id="count">0</span></div>
<div id="status">Bir süre seç, sonra Başla!</div>
<button id="start">BAŞLA</button>
<button id="reset">SIFIRLA</button>
<div class="small">Ekranın siyah alanına dokundukça sayı artar.</div>
<script>
const durations=[5,10,50,100,350,500,800];
let duration=10, count=0, remaining=10, running=false, interval=null, pending=false;
const times=document.getElementById('times'), warning=document.getElementById('warning');
const countEl=document.getElementById('count'), statusEl=document.getElementById('status');
const arena=document.getElementById('arena'), startBtn=document.getElementById('start');
durations.forEach(sec=>{
  const b=document.createElement('button'); b.textContent=sec+' sn';
  if(sec===duration)b.classList.add('selected');
  b.onclick=()=>{
    if(running)return;
    duration=sec; remaining=sec;
    [...times.children].forEach(x=>x.classList.remove('selected')); b.classList.add('selected');
    statusEl.textContent=sec>=100?'Uzun süre seçildi. Başlamadan önce uyarıyı oku.':'Başlamak için BAŞLA düğmesine bas.';
  };
  times.appendChild(b);
});
function reset(){
  clearInterval(interval); running=false; count=0; remaining=duration;
  countEl.textContent='0'; statusEl.textContent='Hazır!'; startBtn.disabled=false; startBtn.textContent='BAŞLA';
}
function begin(){
  warning.style.display='none'; reset(); running=true; startBtn.disabled=true;
  statusEl.textContent='Kalan süre: '+remaining+' saniye';
  interval=setInterval(()=>{
    remaining--;
    if(remaining<=0){remaining=0;clearInterval(interval);running=false;startBtn.disabled=false;startBtn.textContent='TEKRAR OYNA';statusEl.textContent='SÜRE BİTTİ! Toplam tıklama: '+count+' | CPS: '+(count/duration).toFixed(1); }
    else statusEl.textContent='Kalan süre: '+remaining+' saniye';
  },1000);
}
startBtn.onclick=()=>{
  if(running)return;
  if(duration>=100){warning.style.display='block';}
  else begin();
};
document.getElementById('continue').onclick=begin;
document.getElementById('cancel').onclick=()=>warning.style.display='none';
arena.addEventListener('pointerdown',e=>{
  if(!running)return;
  e.preventDefault();count++;countEl.textContent=count;
});
document.getElementById('reset').onclick=()=>{warning.style.display='none';reset();};
reset();
</script>
</body>
</html>
